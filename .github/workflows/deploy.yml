name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: ghcr.io/qin2500/punk-records/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/bot/Dockerfile
          push: true
          tags: ghcr.io/qin2500/punk-records/bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dad's server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Access SSH proxy
        run: |
          cloudflared access ssh \
            --hostname ${{ vars.WINDOWS_SSH_HOSTNAME }} \
            --url localhost:2222 \
            --service-token-id "${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --service-token-secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" &
          echo $! > cloudflared.pid
          for i in $(seq 1 15); do
            (exec 3<>/dev/tcp/localhost/2222) 2>/dev/null && break
            sleep 1
          done

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WINDOWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 localhost >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy files to the server
        run: |
          printf '%s' "${{ secrets.ENV_PRODUCTION }}" > env.production
          scp -P 2222 -i ~/.ssh/deploy_key \
            docker-compose.yml deploy/deploy.ps1 \
            "${{ vars.WINDOWS_SSH_USER }}@localhost:${{ vars.WINDOWS_DEPLOY_PATH }}/"
          scp -P 2222 -i ~/.ssh/deploy_key env.production \
            "${{ vars.WINDOWS_SSH_USER }}@localhost:${{ vars.WINDOWS_DEPLOY_PATH }}/.env.production"

      - name: Run deploy script
        run: |
          ssh -p 2222 -i ~/.ssh/deploy_key "${{ vars.WINDOWS_SSH_USER }}@localhost" \
            "powershell -File '${{ vars.WINDOWS_DEPLOY_PATH }}\\deploy.ps1' -GithubActor '${{ github.actor }}' -GithubToken '${{ secrets.GITHUB_TOKEN }}'"

      - name: Stop Cloudflare Access SSH proxy
        if: always()
        run: kill "$(cat cloudflared.pid)" 2>/dev/null || true
